<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2820" viewBox="0 0 1600 2820" role="img" aria-labelledby="title description">
  <title id="title">Filament request lifecycle</title>
  <desc id="description">Flowchart showing Filament request parsing, routing, body buffering, middleware, route handling, streaming and buffered responses, transformers, commits, all caught exception paths, error handlers, finalizers, and the outer server safety net.</desc>

  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172554" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>

    <style>
      .title { font: 700 48px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff; }
      .subtitle { font: 400 21px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c7d2fe; }
      .lane-title { font: 700 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.4px; }
      .node-title { font: 700 23px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .node-copy { font: 400 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 500 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 600 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; letter-spacing: .3px; }
      .white-title { font: 700 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff; }
      .white-copy { font: 400 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fee2e2; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrow-blue); }
      .flow-slate { fill: none; stroke: #475569; stroke-width: 3.5; marker-end: url(#arrow-slate); }
      .flow-red { fill: none; stroke: #dc2626; stroke-width: 3.5; marker-end: url(#arrow-red); }
      .exception { fill: none; stroke: #dc2626; stroke-width: 3; stroke-dasharray: 9 8; }
      .flow-violet { fill: none; stroke: #7c3aed; stroke-width: 4; marker-end: url(#arrow-violet); }
      .node { fill: #fff; stroke: #bfdbfe; stroke-width: 2; }
      .decision { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2.5; }
      .error-node { fill: #fff; stroke: #fecaca; stroke-width: 2; }
      .final-node { fill: #faf5ff; stroke: #c4b5fd; stroke-width: 2.5; }
      .stop-card { fill: #fff7ed; stroke: #fdba74; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="2820" rx="32" fill="url(#page)"/>
  <path d="M32 0 H1568 Q1600 0 1600 32 V205 H0 V32 Q0 0 32 0" fill="url(#header)"/>
  <circle cx="1500" cy="50" r="165" fill="#4338ca" opacity=".20"/>
  <circle cx="1420" cy="5" r="92" fill="#60a5fa" opacity=".12"/>

  <text x="72" y="82" class="title">Filament request lifecycle</text>
  <text x="74" y="125" class="subtitle">Normal execution, terminal responses, exception routing, and guaranteed cleanup</text>

  <g transform="translate(74 158)">
    <line x1="0" y1="0" x2="46" y2="0" class="flow"/>
    <text x="62" y="6" class="small" style="fill:#e0e7ff">normal flow</text>
    <line x1="210" y1="0" x2="256" y2="0" class="exception"/>
    <text x="270" y="6" class="small" style="fill:#e0e7ff">throw / reject</text>
    <rect x="446" y="-14" width="52" height="28" rx="14" fill="#f97316"/>
    <text x="472" y="6" text-anchor="middle" class="tiny" style="fill:#fff">STOP</text>
    <text x="512" y="6" class="small" style="fill:#e0e7ff">skip named stages</text>
    <line x1="724" y1="0" x2="770" y2="0" class="flow-violet"/>
    <text x="786" y="6" class="small" style="fill:#e0e7ff">always / cleanup</text>
  </g>

  <!-- Lane headers -->
  <rect x="58" y="245" width="858" height="54" rx="16" fill="#dbeafe"/>
  <text x="88" y="280" class="lane-title" fill="#1d4ed8">NORMAL REQUEST FLOW</text>
  <rect x="990" y="245" width="552" height="54" rx="16" fill="#fee2e2"/>
  <text x="1020" y="280" class="lane-title" fill="#b91c1c">EXCEPTION FLOW</text>

  <!-- Normal flow -->
  <g filter="url(#shadow)">
    <rect x="190" y="345" width="570" height="78" rx="39" fill="#1d4ed8"/>
  </g>
  <text x="475" y="394" text-anchor="middle" class="white-title">Incoming HTTP request</text>

  <path d="M475 423 V461" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="150" y="465" width="650" height="126" rx="20" class="node"/>
  </g>
  <circle cx="190" cy="505" r="20" fill="#dbeafe"/>
  <text x="190" y="512" text-anchor="middle" class="small" style="fill:#1d4ed8">1</text>
  <text x="226" y="512" class="node-title">Parse request target and construct req / res</text>
  <text x="190" y="550" class="node-copy">Path, repeated query values, headers, base metadata, context</text>
  <rect x="647" y="553" width="127" height="25" rx="12.5" fill="#fee2e2"/>
  <text x="710" y="571" text-anchor="middle" class="tiny" style="fill:#b91c1c">400 bad target</text>

  <path d="M475 591 V629" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="150" y="633" width="650" height="126" rx="20" class="node"/>
  </g>
  <circle cx="190" cy="673" r="20" fill="#dbeafe"/>
  <text x="190" y="680" text-anchor="middle" class="small" style="fill:#1d4ed8">2</text>
  <text x="226" y="680" class="node-title">Match route and decode path parameters</text>
  <text x="190" y="718" class="node-copy">Populate immutable endpointMeta and decoded req.params</text>
  <rect x="572" y="721" width="98" height="25" rx="12.5" fill="#fee2e2"/>
  <text x="621" y="739" text-anchor="middle" class="tiny" style="fill:#b91c1c">404 miss</text>
  <rect x="680" y="721" width="94" height="25" rx="12.5" fill="#fee2e2"/>
  <text x="727" y="739" text-anchor="middle" class="tiny" style="fill:#b91c1c">400 URI</text>

  <path d="M475 759 V797" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="150" y="801" width="650" height="126" rx="20" class="node"/>
  </g>
  <circle cx="190" cy="841" r="20" fill="#dbeafe"/>
  <text x="190" y="848" text-anchor="middle" class="small" style="fill:#1d4ed8">3</text>
  <text x="226" y="848" class="node-title">Buffer the request body when supported</text>
  <text x="190" y="886" class="node-copy">POST / PUT / PATCH only · enforce endpoint maxRequestSize</text>
  <rect x="641" y="889" width="133" height="25" rx="12.5" fill="#fee2e2"/>
  <text x="707" y="907" text-anchor="middle" class="tiny" style="fill:#b91c1c">413 too large</text>

  <path d="M475 927 V965" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="150" y="969" width="650" height="145" rx="20" class="node"/>
  </g>
  <circle cx="190" cy="1009" r="20" fill="#dbeafe"/>
  <text x="190" y="1016" text-anchor="middle" class="small" style="fill:#1d4ed8">4</text>
  <text x="226" y="1016" class="node-title">Run global middleware in registration order</text>
  <text x="190" y="1055" class="node-copy">Open response on return → automatically continue</text>
  <text x="190" y="1085" class="node-copy">Each middleware reads endpointMeta to decide its policy</text>

  <path d="M475 1114 V1152" class="flow"/>

  <!-- Middleware terminal branch -->
  <path d="M800 1041 H833 V1458 H800" class="flow-slate"/>
  <rect x="684" y="1158" width="232" height="178" rx="18" class="stop-card"/>
  <rect x="704" y="1178" width="58" height="27" rx="13.5" fill="#f97316"/>
  <text x="733" y="1197" text-anchor="middle" class="tiny" style="fill:#fff">STOP</text>
  <text x="704" y="1237" class="node-title" font-size="20">Middleware closes</text>
  <text x="704" y="1270" class="small">send / json / end</text>
  <text x="704" y="1303" class="small" style="fill:#9a3412">skip later middleware,</text>
  <text x="704" y="1326" class="small" style="fill:#9a3412">handler + transformers</text>

  <g filter="url(#shadow)">
    <rect x="150" y="1156" width="500" height="112" rx="20" class="node"/>
  </g>
  <circle cx="190" cy="1196" r="20" fill="#dbeafe"/>
  <text x="190" y="1203" text-anchor="middle" class="small" style="fill:#1d4ed8">5</text>
  <text x="226" y="1203" class="node-title">Run the matched route handler</text>
  <text x="190" y="1241" class="node-copy">A closed route response still follows route post-processing</text>

  <path d="M400 1268 V1306" class="flow"/>

  <path d="M400 1310 L570 1382 L400 1454 L230 1382 Z" class="decision"/>
  <text x="400" y="1375" text-anchor="middle" class="node-title">Response mode?</text>
  <text x="400" y="1405" text-anchor="middle" class="small">Filament supplies implicit end</text>

  <!-- Streaming bypass -->
  <path d="M230 1382 H110 V1591 H150" class="flow-slate"/>
  <text x="106" y="1360" class="tiny" style="fill:#334155">STREAMING</text>
  <text x="83" y="1510" class="small" style="fill:#334155">progressive writes</text>
  <text x="83" y="1535" class="small" style="fill:#334155">never transform</text>

  <!-- Buffered transform path -->
  <path d="M400 1454 V1492" class="flow"/>
  <text x="423" y="1481" class="tiny" style="fill:#1d4ed8">BUFFERED</text>
  <g filter="url(#shadow)">
    <rect x="150" y="1496" width="650" height="126" rx="20" class="node"/>
  </g>
  <text x="190" y="1541" class="node-title">Run every response transformer</text>
  <text x="190" y="1578" class="node-copy">Sequential + awaited · route responses only</text>
  <text x="190" y="1605" class="small">end() inside a transformer does not stop later transformers</text>

  <path d="M475 1622 V1660" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="150" y="1664" width="650" height="104" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="2.5"/>
  </g>
  <text x="190" y="1710" class="node-title">Commit the route or terminal middleware response</text>
  <text x="190" y="1746" class="node-copy">Buffered: native write now · Streaming: await completed end</text>

  <!-- Exception rail from guarded stages -->
  <path d="M950 528 V1738" class="exception"/>
  <path d="M800 528 H950" class="exception"/>
  <path d="M800 696 H950" class="exception"/>
  <path d="M800 864 H950" class="exception"/>
  <path d="M800 1041 H950" class="exception"/>
  <path d="M650 1212 H950" class="exception"/>
  <path d="M800 1559 H950" class="exception"/>
  <path d="M800 1716 H950" class="exception"/>
  <circle cx="950" cy="528" r="6" fill="#dc2626"/>
  <circle cx="950" cy="696" r="6" fill="#dc2626"/>
  <circle cx="950" cy="864" r="6" fill="#dc2626"/>
  <circle cx="950" cy="1041" r="6" fill="#dc2626"/>
  <circle cx="950" cy="1212" r="6" fill="#dc2626"/>
  <circle cx="950" cy="1559" r="6" fill="#dc2626"/>
  <circle cx="950" cy="1716" r="6" fill="#dc2626"/>
  <text x="933" y="928" transform="rotate(-90 933 928)" text-anchor="middle" class="tiny" style="fill:#b91c1c">ANY THROW / REJECT IN THE GUARDED PIPELINE</text>

  <!-- Named framework and runtime exceptions -->
  <path d="M950 528 H1018" class="exception"/>
  <rect x="1018" y="465" width="480" height="126" rx="18" class="error-node"/>
  <text x="1050" y="510" class="node-title">400 · Bad Request</text>
  <text x="1050" y="547" class="node-copy">Malformed request target</text>
  <text x="1460" y="547" text-anchor="end" class="tiny" style="fill:#b91c1c">HttpError</text>

  <path d="M950 696 H1018" class="exception"/>
  <rect x="1018" y="633" width="480" height="126" rx="18" class="error-node"/>
  <text x="1050" y="678" class="node-title">404 · Not Found / 400 · Bad Request</text>
  <text x="1050" y="715" class="node-copy">No matching route / malformed encoded parameter</text>
  <text x="1460" y="742" text-anchor="end" class="tiny" style="fill:#b91c1c">HttpError / URIError</text>

  <path d="M950 864 H1018" class="exception"/>
  <rect x="1018" y="801" width="480" height="126" rx="18" class="error-node"/>
  <text x="1050" y="846" class="node-title">413 · Payload Too Large</text>
  <text x="1050" y="883" class="node-copy">Buffered body exceeds endpoint limit</text>
  <text x="1460" y="910" text-anchor="end" class="tiny" style="fill:#b91c1c">HttpError</text>

  <path d="M950 1090 H1018" class="exception"/>
  <rect x="1018" y="969" width="480" height="278" rx="18" class="error-node"/>
  <text x="1050" y="1014" class="node-title">Thrown values / rejected promises</text>
  <circle cx="1055" cy="1054" r="5" fill="#dc2626"/>
  <text x="1074" y="1061" class="node-copy">middleware policy or response operation</text>
  <circle cx="1055" cy="1095" r="5" fill="#dc2626"/>
  <text x="1074" y="1102" class="node-copy">route handler</text>
  <circle cx="1055" cy="1136" r="5" fill="#dc2626"/>
  <text x="1074" y="1143" class="node-copy">streaming/native write before completion</text>
  <text x="1050" y="1191" class="small">Primitive values become Error(String(value)).</text>
  <text x="1050" y="1220" class="small">Errors retain their original identity.</text>

  <path d="M950 1559 H1018" class="exception"/>
  <rect x="1018" y="1496" width="480" height="126" rx="18" class="error-node"/>
  <text x="1050" y="1541" class="node-title">Post-processing failure</text>
  <text x="1050" y="1578" class="node-copy">Transformer or route commit throws / rejects</text>
  <text x="1460" y="1605" text-anchor="end" class="tiny" style="fill:#b91c1c">Error flow</text>

  <!-- Error flow -->
  <path d="M950 1738 H1018" class="flow-red"/>
  <g filter="url(#shadow)">
    <rect x="1018" y="1664" width="480" height="104" rx="20" fill="#b91c1c"/>
  </g>
  <text x="1052" y="1708" class="white-title">Catch and normalize the error</text>
  <text x="1052" y="1740" class="white-copy">URIError → 400 · primitive → Error(String(value))</text>

  <path d="M1258 1768 V1806" class="flow-red"/>
  <g filter="url(#shadow)">
    <rect x="1018" y="1810" width="480" height="184" rx="20" class="error-node"/>
  </g>
  <text x="1052" y="1854" class="node-title">Run custom error handlers in order</text>
  <circle cx="1056" cy="1891" r="5" fill="#dc2626"/>
  <text x="1074" y="1898" class="node-copy">returns open → next handler</text>
  <circle cx="1056" cy="1931" r="5" fill="#dc2626"/>
  <text x="1074" y="1938" class="node-copy">throws → replace current error, then next</text>
  <circle cx="1056" cy="1971" r="5" fill="#dc2626"/>
  <text x="1074" y="1978" class="node-copy">closes response → error handled</text>

  <!-- Error-handler stop -->
  <rect x="1369" y="1951" width="100" height="28" rx="14" fill="#f97316"/>
  <text x="1419" y="1971" text-anchor="middle" class="tiny" style="fill:#fff">STOP CHAIN</text>

  <path d="M1258 1994 V2032" class="flow-red"/>
  <text x="1280" y="2023" class="tiny" style="fill:#b91c1c">ALL RETURN OPEN</text>
  <g filter="url(#shadow)">
    <rect x="1018" y="2036" width="480" height="166" rx="20" class="error-node"/>
  </g>
  <text x="1052" y="2080" class="node-title">Default error handler</text>
  <text x="1052" y="2116" class="node-copy">Writable → HttpError status or 500 JSON</text>
  <text x="1052" y="2147" class="small">5xx details are replaced with “Internal Server Error”</text>
  <text x="1052" y="2181" class="node-copy">Headers frozen / committed → cannot replace response</text>

  <!-- Error branches to finalization -->
  <path d="M1498 1902 H1530 V2318 H1390" class="flow-violet"/>
  <text x="1509" y="1885" class="tiny" style="fill:#7c3aed">CLOSED</text>
  <path d="M1258 2202 V2286" class="flow-violet"/>

  <!-- Normal path to finalization -->
  <path d="M475 1768 V2244 H720 V2286" class="flow-violet"/>

  <!-- Finalizers -->
  <g filter="url(#shadow)">
    <rect x="210" y="2290" width="1180" height="144" rx="24" class="final-node"/>
  </g>
  <circle cx="260" cy="2340" r="24" fill="#ede9fe"/>
  <path d="M250 2340 l8 8 15 -18" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="302" y="2340" class="node-title">Run all finalizers — success, terminal middleware, or error</text>
  <text x="302" y="2380" class="node-copy">Sequential + awaited · a thrown finalizer is logged and later finalizers continue</text>
  <text x="302" y="2410" class="small">Finalizers observe and clean up; they do not re-enter the error-handler chain</text>

  <path d="M800 2434 V2472" class="flow-violet"/>
  <g filter="url(#shadow)">
    <rect x="330" y="2476" width="940" height="114" rx="22" class="final-node"/>
  </g>
  <text x="800" y="2521" text-anchor="middle" class="node-title">Finally: ensure end() + commit()</text>
  <text x="800" y="2558" text-anchor="middle" class="node-copy">Both operations are idempotent and share existing completion promises</text>

  <path d="M800 2590 V2628" class="flow-violet"/>
  <g filter="url(#shadow)">
    <rect x="560" y="2632" width="480" height="82" rx="41" fill="#5b21b6"/>
  </g>
  <text x="800" y="2683" text-anchor="middle" class="white-title">Request lifecycle complete</text>

  <!-- Outer server safety net -->
  <rect x="76" y="2030" width="810" height="174" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="76" y="2030" width="12" height="174" rx="6" fill="#475569"/>
  <text x="116" y="2075" class="node-title">Outer server safety net</text>
  <text x="116" y="2113" class="node-copy">Unexpected setup failure, error-response failure, or final end / commit failure</text>
  <text x="116" y="2148" class="node-copy">→ log “Unhandled error in request handler”</text>
  <text x="116" y="2183" class="node-copy">→ if headers are unsent, emit a native 500; otherwise the response cannot be replaced</text>
  <path d="M150 528 H46 V2117 H76" class="flow-red"/>
  <text x="64" y="1260" transform="rotate(-90 64 1260)" text-anchor="middle" class="tiny" style="fill:#64748b">UNEXPECTED FAILURE BEFORE THE GUARDED TRY</text>
  <path d="M330 2533 H110 V2240 H330 V2204" class="flow-red"/>
  <path d="M1018 2118 H922 V2204 H886" class="flow-red"/>

  <!-- Footer note -->
  <rect x="76" y="2760" width="1448" height="2" fill="#cbd5e1"/>
  <text x="800" y="2796" text-anchor="middle" class="small">STOP skips only the named chain or stages. Finalizers still run after every request that enters the guarded pipeline.</text>
</svg>
